# =====================================================================
#  Contenedor local de SQL Server (Docker) — Tienda Online
#  Uso:  docker compose -f db/sqlserver/docker-compose.yml up -d
#  Luego ejecuta los scripts .sql en orden con sqlcmd o SSMS.
# =====================================================================
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tienda-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Tienda!Pass2026"   # cámbiala en producción
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Tienda!Pass2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
